name: Comprobaciones

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Verificar estructura y build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json
      - name: Instalar dependencias
        run: |
          npm ci
          npm run setup
      - name: Revisar código
        run: npm run check
      - name: Probar backend
        run: npm run test:backend
      - name: Probar cliente frontend
        run: npm run test:frontend
      - name: Validar Compose
        run: bash scripts/localemu.sh config
      - name: Compilar frontend
        run: npm run build
      - name: Preparar Chromium
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chromium --only-shell
      - name: Probar interfaz en navegador
        run: npm run test:frontend:e2e
